<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Bakery - Product Enquiry</title>
</head>
<body>

    <!-- Header and Navigation -->
    <header>
        <h1>Apex Bakery</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="enquiry.html">Enquiry</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content -->
    <main>
        <section>
            <h2>Product & Custom Order Enquiry</h2>
            <p>Fill out the form below to enquire about custom orders or bulk purchases.</p>

            <form action="#" method="post">
                <label for="fullname">Full Name:</label><br>
                <input type="text" id="fullname" name="fullname" required><br><br>

                <label for="email">Email Address:</label><br>
                <input type="email" id="email" name="email" required><br><br>

                <label for="service">Select Service/Product:</label><br>
                <select id="service" name="service">
                    <option value="custom-cake">Custom Cake</option>
                    <option value="catering">Event Catering</option>
                    <option value="bulk-bread">Bulk Order</option>
                </select><br><br>

                <label for="message">Enquiry Details:</label><br>
                <textarea id="message" name="message" rows="5" cols="30" required></textarea><br><br>

                <button type="submit">Submit Enquiry</button>
            </form>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Apex Bakery. All rights reserved.</p>
    </footer>

</body>
</html>
